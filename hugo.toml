baseURL = "https://blog.paymond.me/"
languageCode = "zh-cn"
title = "Jared 的技术博客"
theme = "hugo-blog-awesome"
ignoreFiles = ["content/drafts/"]
enableRobotsTXT = true
enableEmoji = true

[services.googleAnalytics]
  id = ""

[params]
  sitename = "Jared 的技术博客"
  defaultColor = "auto"
  description = "Jared 的个人博客，分享编程开发、AI 工具、支付风控与技术思考。"
  mainSections = ["posts"]
  toc = true
  tocOpen = false
  goToTop = true
  dateFormat = "2006年01月02日"
  rssFeedDescription = "summary"
  env = "production"
  disableHLJS = true
  favicon = "favicon.ico"
  appleTouchIcon = "apple-touch-icon.png"
  ogimage = "/apple-touch-icon.png"

[params.author]
  name = "Jared"
  intro = "Jared"
  description = "分享技术、开发和生活中的思考"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/ilderajmi"

[[params.socialIcons]]
  name = "Rss"
  url = "/index.xml"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = false

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 3
  [[menu.main]]
    identifier = "policies"
    name = "隐私与条款"
    url = "/policies/privacy-policy/"
    weight = 4

[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[minify.tdewolff.html]
  keepWhitespace = false
