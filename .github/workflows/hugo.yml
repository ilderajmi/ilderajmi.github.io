name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v2
        with:
          # 固定版本：'latest' 会让线上构建与本机验证用的 Hugo 版本不一致。
          # Hugo 0.166 已移除 site.Author，0.158 起弃用 languageCode 与
          # .Site.LanguageCode，主题与本仓库仍在使用这些写法。
          hugo-version: '0.154.2'
          extended: true
      - run: bash ./scripts/post-seo-geo-lint.sh
      - run: node --test scripts/analytics.test.mjs
      - run: hugo --gc --minify --cleanDestinationDir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
