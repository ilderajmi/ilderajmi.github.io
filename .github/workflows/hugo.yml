name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true
      - run: bash ./scripts/post-seo-geo-lint.sh
      - run: hugo --gc --minify --cleanDestinationDir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines (Bing + optional Google)
        continue-on-error: true
        env:
          SITEMAP_URL: https://blog.paymond.me/sitemap.xml
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_SITEMAP_URL: ${{ secrets.GSC_SITEMAP_URL }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
        run: bash ./scripts/notify-search-engines.sh
