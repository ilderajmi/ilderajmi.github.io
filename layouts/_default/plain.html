<!DOCTYPE html>
<html lang="{{ or .Params.pageLang .Site.LanguageCode }}">
{{- partial "plain-head.html" . -}}
<body class="plain-page">
  {{- $content := .Content -}}
  {{- if and (eq .Section "posts") (eq .Kind "page") -}}
    {{- $content = replaceRE `(?s)^\s*<h1[^>]*>.*?</h1>\s*` "" $content -}}
  {{- end }}
  {{ $content | safeHTML }}
</body>
</html>
