{{- $t := partial "ff/topic.html" . -}}
{{- $en := eq .Params.pageLang "en" -}}
<li{{ with $t }} data-topic="{{ .id }}"{{ end }}><a class="post-row{{ if $en }} en{{ end }}" href="{{ .RelPermalink }}"{{ if $en }} lang="en"{{ end }}><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01-02" }}</time><div><h3>{{ .Title }}</h3>{{ with .Description }}<p>{{ . }}</p>{{ end }}</div><div class="tags">{{ partial "ff/pills.html" (dict "page" . "limit" 2) }}</div></a></li>
